name: Kernel qualification
on:
  pull_request:
  push:
    branches: [main, 'impl/**']
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, semantic and real process tests
        run: python -B -m unittest discover -s tests -v
      - name: Qualify this host and source fingerprint
        run: python -I -S -B run_kernel.py qualify
      - name: Windows PowerShell 5.1 launcher smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & .\launchers\Invoke-Kernel.ps1 -Mode contract
          if ($LASTEXITCODE -ne 0) { throw 'Launcher failed' }
